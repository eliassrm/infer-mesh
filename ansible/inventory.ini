# Replace management addresses, radio identifiers, and SSH settings after hardware verification.
# Supply mesh_key securely at playbook time, for example with Ansible Vault.

[mesh_backbone]
shg3060 ansible_host=192.168.50.11 bat_ip=10.10.0.11 mesh_radio=REPLACE_WITH_OPENWRT_RADIO probe_target=10.10.0.12
shg3000 ansible_host=192.168.50.12 bat_ip=10.10.0.12 mesh_radio=REPLACE_WITH_OPENWRT_RADIO probe_target=10.10.0.11
tl-wr841nd ansible_host=192.168.50.14 bat_ip=10.10.0.14 mesh_radio=REPLACE_WITH_OPENWRT_RADIO probe_target=10.10.0.11

[degradation_nodes]
shg2500 ansible_host=192.168.50.13 bat_ip=10.10.0.13 mesh_radio=REPLACE_WITH_OPENWRT_RADIO probe_target=10.10.0.11

[collectors]
wd300 ansible_host=192.168.50.20

[mesh_nodes:children]
mesh_backbone
degradation_nodes

[telemetry_nodes]
# Opt in nodes only after confirming flash/RAM capacity for python3-light.
# shg3060
# shg3000
# shg2500

[mesh_nodes:vars]
ansible_user=root
ansible_connection=ssh
mesh_name=infer-mesh-lab
mesh_interface=mesh0
bat_interface=bat0
mesh_channel=1
mesh_htmode=HT20
mesh_country=IT
mesh_encryption=sae

[collectors:vars]
ansible_user=root
ansible_connection=ssh
